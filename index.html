<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bad Time Simulator Sandbox</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .hud {
            margin-bottom: 15px;
            text-align: center;
        }

        .hud h1 {
            font-size: 24px;
            color: #ff0000;
            letter-spacing: 2px;
            margin-bottom: 5px;
        }

        .timer-display {
            font-size: 18px;
            color: #00ff00;
        }

        .game-wrapper {
            position: relative;
        }

        canvas {
            border: 4px solid #ffffff;
            background-color: #000000;
            display: block;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
        }

        .controls-info {
            margin-top: 15px;
            font-size: 14px;
            color: #aaaaaa;
            text-align: center;
            max-width: 600px;
            line-height: 1.5;
        }

        .game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .game-over-screen h2 {
            color: #ff0000;
            font-size: 40px;
            margin-bottom: 10px;
        }

        .game-over-screen p {
            font-size: 18px;
            margin-bottom: 20px;
            color: #ffffff;
        }

        .btn {
            background-color: #000000;
            color: #ffffff;
            border: 2px solid #ffffff;
            padding: 10px 20px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn:hover {
            background-color: #ffffff;
            color: #000000;
        }
    </style>
</head>
<body>

<div class="hud">
    <h1>BAD TIME SIMULATOR</h1>
    <div class="timer-display">Survial Clock: <span id="clock-time">00:00.00</span></div>
</div>

<div class="game-wrapper">
    <canvas id="gameCanvas" width="640" height="480"></canvas>
    
    <div class="game-over-screen" id="gameOverWindow">
        <h2>GAME OVER</h2>
        <p>You had a bad time.</p>
        <p>Time Survived: <span id="final-time">00:00.00</span></p>
        <button class="btn" onclick="resetSimulator()">Try Again</button>
    </div>
</div>

<div class="controls-info">
    [Arrow Keys] Move Heart Soul &nbsp;|&nbsp; [Z Key] Jump Higher &nbsp;|&nbsp; Avoid the bones!
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const clockDisplay = document.getElementById('clock-time');
    const gameOverWindow = document.getElementById('gameOverWindow');
    const finalTimeDisplay = document.getElementById('final-time');

    // Battle Box Dimensions
    const box = {
        x: 170,
        y: 200,
        width: 300,
        height: 200
    };

    // Heart Soul State
    let soul = {
        x: 320,
        y: 300,
        size: 16,
        vx: 0,
        vy: 0,
        speed: 4,
        isGrounded: false
    };

    // Physics Engine Constants
    const gravity = 0.3;
    const jumpForce = -6.5;

    // Simulation Flags
    let isLive = true;
    let launchTime = Date.now();
    let accumulatedTime = 0;
    let keys = {};
    let projectiles = [];
    let spawnTimer = 0;

    // Handle Input Trackers
    window.addEventListener('keydown', e => { keys[e.key] = true; });
    window.addEventListener('keyup', e => { keys[e.key] = false; });

    function formatClock(ms) {
        let min = Math.floor(ms / 60000);
        let sec = Math.floor((ms % 60000) / 1000);
        let subs = Math.floor((ms % 1000) / 10);
        return `${min.toString().padStart(2, '0')}:${sec.toString().padStart(2, '0')}.${subs.toString().padStart(2, '0')}`;
    }

    function createProjectile() {
        // Randomly spawn a bone variant from the left or right walls
        const fromLeft = Math.random() > 0.5;
        const heightVariant = Math.floor(Math.random() * 60) + 30;
        
        projectiles.push({
            x: fromLeft ? box.x - 20 : box.x + box.width + 20,
            y: box.y + box.height - heightVariant,
            w: 12,
            h: heightVariant,
            vx: fromLeft ? (Math.random() * 2 + 2) : -(Math.random() * 2 + 2)
        });
    }

    function resetSimulator() {
        soul.x = box.x + box.width / 2;
        soul.y = box.y + box.height - soul.size;
        soul.vx = 0;
        soul.vy = 0;
        projectiles = [];
        spawnTimer = 0;
        launchTime = Date.now();
        isLive = true;
        gameOverWindow.style.display = 'none';
        loop();
    }

    function update() {
        if (!isLive) return;

        // X Movement Calculation
        if (keys['ArrowLeft']) soul.vx = -soul.speed;
        else if (keys['ArrowRight']) soul.vx = soul.speed;
        else soul.vx = 0;

        // Jump Handling
        if (keys['ArrowUp'] && soul.isGrounded) {
            soul.vy = jumpForce;
            if (keys['z'] || keys['Z']) soul.vy = jumpForce * 1.2; // High jump modifier
            soul.isGrounded = false;
        }

        // Apply Gravity Engine
        soul.vy += gravity;
        soul.x += soul.vx;
        soul.y += soul.vy;

        // Collision detection with Battle Arena Box Boundaries
        if (soul.x < box.x) soul.x = box.x;
        if (soul.x + soul.size > box.x + box.width) soul.x = box.x + box.width - soul.size;
        
        if (soul.y + soul.size >= box.y + box.height) {
            soul.y = box.y + box.height - soul.size;
            soul.vy = 0;
            soul.isGrounded = true;
        }
        if (soul.y < box.y) {
            soul.y = box.y;
            soul.vy = 0;
        }

        // Spawn Projectile Bones over time
        spawnTimer++;
        if (spawnTimer % 45 === 0) {
            createProjectile();
        }

        // Projectile handling loop
        for (let i = projectiles.length - 1; i >= 0; i--) {
            let p = projectiles[i];
            p.x += p.vx;

            // AABB Box Hit detection logic
            if (soul.x < p.x + p.w && soul.x + soul.size > p.x &&
                soul.y < p.y + p.h && soul.y + soul.size > p.y) {
                // Soul structural crash detected
                isLive = false;
                accumulatedTime = Date.now() - launchTime;
                finalTimeDisplay.innerText = formatClock(accumulatedTime);
                gameOverWindow.style.display = 'flex';
            }

            // Clean up out of bounds bones
            if (p.vx > 0 && p.x > box.x + box.width + 50) projectiles.splice(i, 1);
            else if (p.vx < 0 && p.x < box.x - 50) projectiles.splice(i, 1);
        }

        // Keep local countdown active
        accumulatedTime = Date.now() - launchTime;
        clockDisplay.innerText = formatClock(accumulatedTime);
    }

    function draw() {
        // Clear Screen
        ctx.fillStyle = '#000000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Draw Battle Boundary Box Inner
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 5;
        ctx.strokeRect(box.x, box.y, box.width, box.height);

        // Draw Projectile Bone Objects
        ctx.fillStyle = '#ffffff';
        projectiles.forEach(p => {
            ctx.fillRect(p.x, p.y, p.w, p.h);
        });

        // Draw Heart Soul Asset
        ctx.fillStyle = '#ff0000';
        ctx.beginPath();
        let x = soul.x + soul.size / 2;
        let y = soul.y + soul.size / 2;
        let topY = y - soul.size / 2;
        
        // Simple pixelated heart geometry vector map
        ctx.moveTo(x, y + soul.size / 2);
        ctx.lineTo(x - soul.size / 2, y - soul.size / 6);
        ctx.bezierCurveTo(x - soul.size / 2, topY, x, topY, x, y - soul.size / 6);
        ctx.bezierCurveTo(x, topY, x + soul.size / 2, topY, x + soul.size / 2, y - soul.size / 6);
        ctx.closePath();
        ctx.fill();
    }

    function loop() {
        update();
        draw();
        if (isLive) {
            requestAnimationFrame(loop);
        }
    }

    // Initialize Simulator Setup
    resetSimulator();
</script>
</body>
</html>
